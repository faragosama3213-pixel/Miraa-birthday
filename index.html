<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Miraa ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse,#25204f,#08091c);color:white;font-family:Georgia,serif;display:grid;place-items:center;text-align:center;overflow-x:hidden}.page{padding:24px;width:min(560px,100%)}.date{font-size:28px;letter-spacing:8px;color:#ffe7a3;margin:20px}.stage{position:relative;height:330px;perspective:900px}.inside{position:absolute;inset:0;border:1px solid #ffe7a3;border-radius:16px;background:#11112e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px}.inside h1{color:#ffe7a3;font-size:40px;margin:10px}.inside p{font-style:italic;font-size:18px;line-height:1.5;color:#f7d9ed}.curtain{position:absolute;inset:0;display:flex;z-index:2;transition:transform 1.5s ease,opacity 1.5s ease;cursor:pointer}.half{width:50%;height:100%;background:repeating-linear-gradient(90deg,#781d58,#b83d7c 18px,#81235e 36px);display:grid;place-items:center;border:1px solid #f8b5d7}.half span{color:#fff0c0;font-size:22px;font-weight:bold;text-shadow:0 0 12px #ffe7a3}.left{border-radius:16px 0 0 16px}.right{border-radius:0 16px 16px 0}.curtain.open{transform:scaleX(0);opacity:0;pointer-events:none}.btn{background:#ffe7b1;color:#25152e;border:0;border-radius:28px;padding:14px 24px;font-size:17px;font-weight:bold;margin-top:20px;cursor:pointer}.message{display:none;margin-top:25px;line-height:1.9;font-size:21px;color:#fff0fb}.message.show{display:block;animation:fade 1s ease}@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.stars{position:fixed;inset:0;pointer-events:none;color:#fff0bd;opacity:.7;letter-spacing:18px;line-height:2.5;z-index:-1}
</style>
</head>
<body><div class="stars">✦ · · ✧ · ✦ · · ✧ · ✦ · · ✧ · ✦ · · ✧ · ✦ · · ✧ · ✦ · · ✧</div><main class="page"><div class="date">22 / 10</div><div class="stage"><div class="inside"><div style="font-size:48px">✨</div><h1>For Miraa</h1><p>The world is even more beautiful than your birthday</p></div><div class="curtain" id="curtain" onclick="openGift()"><div class="half left"><span>22 / 10</span></div><div class="half right"><span>22 / 10</span></div></div></div><button class="btn" id="open" onclick="openGift()">Open your surprise ✨</button><div class="message" id="message"><div style="font-size:32px;color:#ffe7a3">Miraa 💗</div><p>Kol sana w enty tayeba ya miraa h7ytii w 3o2bal million sana 😍😍</p><p>احلي واحده تصغر سنه 😘❤️❤️</p></div></main><script>function openGift(){document.getElementById("curtain").classList.add("open");document.getElementById("message").classList.add("show");document.getElementById("open").textContent="Happy Birthday Miraa ❤️";document.getElementById("open").disabled=true}</script></body></html>
